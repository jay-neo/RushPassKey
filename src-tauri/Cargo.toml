[package]
name = "rushpasskey"
version = "1.0.1"
description = "an exceptional password manager"
authors = ["Jagadish Sau <jay-neo@outlook.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rushpasskey_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
tauri-plugin-shell = "2.0.0-rc"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"
dirs = "5.0.1"
once_cell = "1.19.0"
aes = "0.8.4"
base64 = "0.22.1"
sha2 = "0.10.8"
hex = "0.4.3"
block-padding = "0.3.3"
ring = "0.17.8"
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
cipher = "0.4.4"
cbc = "0.1.2"
chrono = "0.4.38"
tauri-plugin-clipboard-manager = "2.3.0"
